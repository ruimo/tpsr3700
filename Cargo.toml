[package]
name = "tpsr3700"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
fontdue = "0.9"
rusb = "0.9"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
eframe = { version = "0.35.0", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = { version = "0.35.0", optional = true }
dirs = { version = "6.0.0", optional = true }

[features]
default = ["preview"]
preview = ["dep:eframe", "dep:egui", "dep:dirs"]
