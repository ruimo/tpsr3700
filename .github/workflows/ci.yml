name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v[0-9]*']
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            libusb_install: sudo apt-get update -q && sudo apt-get install -y libusb-1.0-0-dev
          - os: macos-latest
            libusb_install: brew install libusb

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install libusb
        run: ${{ matrix.libusb_install }}

      - name: cargo test
        run: cargo test
