name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: tpsr3700-linux-x86_64
            libusb_install: sudo apt-get update -q && sudo apt-get install -y libusb-1.0-0-dev

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: tpsr3700-macos-x86_64
            libusb_install: brew install libusb

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: tpsr3700-macos-aarch64
            libusb_install: brew install libusb

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install libusb
        run: ${{ matrix.libusb_install }}

      - name: Run tests
        # aarch64-apple-darwin cannot run natively on x86_64 runner; skip execution
        if: matrix.target != 'aarch64-apple-darwin'
        run: cargo test --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/tpsr3700 ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
