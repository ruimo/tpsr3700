name: Release

on:
  # Manual trigger from the Actions UI
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options: [patch, minor, major]

  # Also fires when a v* tag is pushed directly (e.g. via the manual workflow above)
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  # ── Step 1: bump version, commit, and push a new tag ────────────────────────
  # Runs only for the manual workflow_dispatch trigger.
  bump:
    name: Bump version (${{ inputs.bump }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Use a token that has permission to push commits and tags
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version in Cargo.toml and create tag
        id: bump
        shell: bash
        run: |
          set -euo pipefail

          # Read current version
          current=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "Current version: $current"

          # Split into components
          major=$(echo "$current" | cut -d. -f1)
          minor=$(echo "$current" | cut -d. -f2)
          patch=$(echo "$current" | cut -d. -f3)

          # Bump the selected component
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          new="${major}.${minor}.${patch}"
          tag="v${new}"
          echo "New version: $new  tag: $tag"

          # Update Cargo.toml
          sed -i "s/^version = \"${current}\"/version = \"${new}\"/" Cargo.toml

          # Update Cargo.lock (keeps it in sync without a full build)
          cargo update --workspace --precise "$new" 2>/dev/null || true

          # Commit and tag
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: bump version to ${new}"
          git tag "$tag"
          git push origin HEAD:${{ github.ref_name }} "$tag"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # ── Step 2: build release binaries ──────────────────────────────────────────
  build:
    name: Build (${{ matrix.target }})
    # Wait for bump when triggered manually; start immediately on tag push
    needs: [bump]
    if: always() && (needs.bump.result == 'success' || needs.bump.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: tpsr3700-linux-x86_64
            libusb_install: sudo apt-get update -q && sudo apt-get install -y libusb-1.0-0-dev

          - os: macos-14
            target: aarch64-apple-darwin
            artifact: tpsr3700-macos-aarch64
            libusb_install: brew install libusb

    steps:
      - uses: actions/checkout@v7
        with:
          # Check out the tag that was just created (or the pushed tag)
          ref: ${{ needs.bump.outputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install libusb
        run: ${{ matrix.libusb_install }}

      - name: Run tests
        # aarch64-apple-darwin cannot run natively on an x86_64 runner
        if: matrix.target != 'aarch64-apple-darwin'
        run: cargo test --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/tpsr3700 tpsr3700
          zip ${{ matrix.artifact }}.zip tpsr3700

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

  # ── Step 3: create GitHub Release and attach binaries ───────────────────────
  release:
    name: Create GitHub Release
    needs: [bump, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump.outputs.tag || github.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bump.outputs.tag || github.ref_name }}
          files: artifacts/**/*
          generate_release_notes: true
